[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-harness-control-plugin"
version = "0.1.0"
description = "Hermes-native ACP coding-harness control tools backed by ACPX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Duy Bui" }]
keywords = ["hermes-agent", "acp", "acpx", "coding-agents", "orchestration"]
dependencies = []

[project.entry-points."hermes_agent.plugins"]
harness-control = "harness_control.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["harness_control"]

[tool.hatch.build.targets.sdist]
include = [
  "/harness_control",
  "/scripts",
  "/tests",
  "/docs",
  "/__init__.py",
  "/plugin.yaml",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "RUF043", "S101", "S603", "S607", "S108"]
"scripts/**/*.py" = ["E501", "S101"]
"**/__init__.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
warn_unused_ignores = true
